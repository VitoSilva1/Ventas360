# Kafka streaming platform: 1 Zookeeper, 3 brokers, topic bootstrap job and Kafka-UI.
# Run together with the main stack so both share the "backend" network:
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
# Or standalone (platform only):
#   docker compose -f docker-compose.kafka.yml up -d

x-kafka-broker: &kafka-broker
  image: confluentinc/cp-kafka:7.7.1
  restart: unless-stopped
  depends_on:
    zookeeper:
      condition: service_healthy
  networks:
    - backend
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
    start_period: 20s
    interval: 10s
    timeout: 10s
    retries: 30

x-kafka-broker-environment: &kafka-broker-environment
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Cluster-wide defaults sized for a 3-broker cluster.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Topics are created explicitly by kafka-topics-init with their own settings.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: ventas360-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - backend
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181'"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-1:
    <<: *kafka-broker
    hostname: kafka-1
    container_name: ventas360-kafka-1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      <<: *kafka-broker-environment
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-broker
    hostname: kafka-2
    container_name: ventas360-kafka-2
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      <<: *kafka-broker-environment
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-broker
    hostname: kafka-3
    container_name: ventas360-kafka-3
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      <<: *kafka-broker-environment
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # One-shot job: creates the application topics (idempotent) and exits.
  kafka-topics-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ventas360-kafka-topics-init
    restart: "no"
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    volumes:
      - ./docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - backend

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ventas360-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ventas360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - backend

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

networks:
  backend:
