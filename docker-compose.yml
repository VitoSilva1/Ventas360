x-backend-environment: &backend-environment
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Ventas360
  EUREKA_URL: http://service-registry:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ventas360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Ventas360
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ventas360-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20

  service-registry:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: service-registry
    container_name: ventas360-service-registry
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      EUREKA_URL: http://service-registry:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: auth-service
    container_name: ventas360-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: auth-service
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID must be set}
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30

  product-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: product-service
    container_name: ventas360-product-service
    restart: unless-stopped
    environment:
      <<: *backend-environment
      SERVER_PORT: 8083
      EUREKA_INSTANCE_HOSTNAME: product-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30

  sales-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: sales-service
    container_name: ventas360-sales-service
    restart: unless-stopped
    environment:
      <<: *backend-environment
      SERVER_PORT: 8082
      EUREKA_INSTANCE_HOSTNAME: sales-service
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30

  api-gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: api-gateway
    container_name: ventas360-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      EUREKA_URL: http://service-registry:8761/eureka/
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID must be set}
    depends_on:
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 60

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID must be set}
    container_name: ventas360-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:4200:80"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ventas360-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbit-mq:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: rabbit-mq
    container_name: ventas360-rabbit-mq
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: rabbit-mq
    ports:
      - "8084:8084"
    depends_on:
      service-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30

  mail-carrier-consumer:
    build:
      context: backend/mail-carrier
      dockerfile: Dockerfile
    container_name: ventas360-mail-carrier-consumer
    restart: unless-stopped
    entrypoint: ["python", "-m", "mail_carrier.amqp_consumer"]

    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_QUEUE: ventas360.mail.queue
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Ventas360}
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy

volumes:
  ventas360-postgres-data:
