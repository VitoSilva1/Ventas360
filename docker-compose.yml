services:
  postgres:
    image: postgres:16-alpine
    container_name: ventas360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Ventas360
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - ventas360-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20

  service-registry:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: service-registry
    container_name: ventas360-service-registry
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      EUREKA_URL: http://service-registry:8761/eureka/
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: auth-service
    container_name: ventas360-auth-service
    restart: unless-stopped
    environment: &backend-environment
      SERVER_PORT: 8081
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Ventas360
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30

  product-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: product-service
    container_name: ventas360-product-service
    restart: unless-stopped
    environment:
      <<: *backend-environment
      SERVER_PORT: 8083
      EUREKA_INSTANCE_HOSTNAME: product-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30

  sales-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: sales-service
    container_name: ventas360-sales-service
    restart: unless-stopped
    environment:
      <<: *backend-environment
      SERVER_PORT: 8082
      EUREKA_INSTANCE_HOSTNAME: sales-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30

  api-gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: api-gateway
    container_name: ventas360-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      EUREKA_URL: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/products >/dev/null"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 60

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: ventas360-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  ventas360-postgres-data:
