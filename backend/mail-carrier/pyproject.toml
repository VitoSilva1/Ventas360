[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-carrier"
version = "0.1.0"
description = "Standalone module that sends HTML emails through Gmail SMTP."
requires-python = ">=3.12"
dependencies = ["pydantic[email]>=2.7,<3", "pika>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
