logging:
  structured:
    # ECS JSON on the console (Spring Boot property: logging.structured.format.console).
    # MDC entries become searchable fields of every log event.
    format:
      console: ecs

spring:
  application:
    name: sales-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  config:
    # Kafka client settings live in kafka.yaml so tests load the exact same configuration.
    import: classpath:kafka.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/Ventas360
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: ${SERVER_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

rabbitmq:
  ventas360:
    queues:
      sales: ventas360.sales.queue

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Deshabilitar exportación OTLP — no hay OpenTelemetry collector en este entorno.
  otlp:
    metrics:
      export:
        enabled: false
