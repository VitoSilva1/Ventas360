logging:
  structured:
    # ECS JSON on the console: MDC entries (kafka.topic, kafka.partition, kafka.offset, kafka.key)
    # become searchable fields of every log event.
    format:
      console: ecs

spring:
  application:
    name: kafka-admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

server:
  port: ${SERVER_PORT:8086}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

ventas360:
  kafka-admin:
    # Upper bound for every Admin API call before answering 503.
    timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
