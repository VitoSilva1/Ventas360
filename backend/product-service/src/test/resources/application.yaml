spring:
  config:
    import: classpath:kafka.yaml
  kafka:
    listener:
      # No broker in most tests; listener tests turn this back on with an embedded broker.
      auto-startup: false
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:product_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
