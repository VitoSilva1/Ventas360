<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">
      <img src="ventas360-icon.png" alt="Logo de Ventas 360">
    </div>
    <div><strong>Ventas 360</strong><span>Panel comercial</span></div>
  </div>
  <nav class="main-nav" aria-label="Navegacion principal">
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
      <span class="nav-icon">&#8962;</span>Resumen
    </a>
    <a class="nav-item" routerLink="/products" routerLinkActive="active">
      <span class="nav-icon">&#9638;</span>Productos
    </a>
    <a class="nav-item" routerLink="/sales" routerLinkActive="active">
      <span class="nav-icon">&#8599;</span>Ventas
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="status-dot"
         [class.online]="backendOnline() === true"
         [class.offline]="backendOnline() === false"
         [class.checking]="backendOnline() === null">
    </div>
    <div>
      <strong>{{ backendOnline() === null ? 'Verificando...' : backendOnline() ? 'Backend conectado' : 'Sin conexion' }}</strong>
      <span>API Gateway &middot; :8080</span>
    </div>
  </div>
</aside>
